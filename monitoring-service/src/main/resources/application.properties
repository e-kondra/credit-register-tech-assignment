server.port=8082

# Kafka - Consumer
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=monitoring-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=creditBanEvent:com.example.monitoring.dto.CreditBanEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Kafka - Topic
kafka.topic.creditBan=credit-ban-events

# Email configuration
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

monitoring.email.to=${MONITORING_EMAIL_TO}
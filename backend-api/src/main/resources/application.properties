# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/creditdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=user
spring.datasource.password=password

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka - Producer
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=creditBanEvent:com.example.backend.dto.CreditBanEvent

# Kafka - Topic
kafka.topic.creditBan=credit-ban-events

# PCR API (mock)
pcr.api.url=http://localhost:8080/api/mock/pcr/extract
pcr.owner.idCodeType=BusinessId
pcr.owner.idCode=12345-6789
pcr.owner.countryCode=LT
pcr.targetEnvironment=Test

# Logging
logging.level.com.example.backend=DEBUG
logging.level.org.springframework.kafka=INFO
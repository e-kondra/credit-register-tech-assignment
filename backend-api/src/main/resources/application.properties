# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/creditdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# PCR API (mock)
pcr.api.url=http://localhost:8081/extract
pcr.owner.idCodeType=BusinessId
pcr.owner.idCode=12345-6789
pcr.owner.countryCode=LT
pcr.targetEnvironment=Test